name: Flutter Quality & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Flutter Lint, Format & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Outdated & Security Check
        run: flutter pub outdated

      - name: Verify Code Formatting
        run: dart format --output=none .

      - name: Analyze Static Code Quality
        run: flutter analyze

      - name: Run Automated Test Suite with Coverage
        run: flutter test --coverage
