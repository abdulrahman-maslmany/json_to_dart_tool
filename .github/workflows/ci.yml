name: Flutter Quality & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ✅ تقييد الصلاحيات لمبدأ الأمان الأقصى
permissions:
  contents: read

# ✅ تحديد الحد الأدنى الإجباري للتغطية
env:
  COVERAGE_THRESHOLD: 70

jobs:
  analyze-and-test:
    name: Flutter Lint, Format & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ تثبيت الـ Commit SHA لمنع أي تحذيرات أمنية
      - name: Setup Flutter Environment
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Outdated Check
        run: flutter pub outdated

      # ✅ يوقف الـ CI فوراً إذا كان هناك أي كود غير منسق
      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      # ✅ فحص صارم للجودة والـ Lints
      - name: Analyze Static Code Quality
        run: flutter analyze --fatal-infos --fatal-warnings

      # ✅ تثبيت أداة lcov لاستخراج تقرير التغطية
      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install -y lcov

      # ✅ تشغيل الاختبارات واستخراج التغطية
      - name: Run Automated Test Suite with Coverage
        run: flutter test --coverage

      # ✅ بوابة إجبارية تفشل الـ CI إذا كانت التغطية أقل من الحد الأدنى (Enforced Coverage Gate)
      - name: Enforce & Report Coverage Gate
        run: |
          lcov --summary coverage/lcov.info
          
          # استخراج النسبة المئوية لعدد الأسطر المغطاة
          COVERAGE=$(lcov --summary coverage/lcov.info | awk -F'[:%]' '/lines/ {gsub(/ /, "", $2); print $2}')
          echo "Current Code Coverage: ${COVERAGE}%"
          echo "Required Minimum Threshold: ${COVERAGE_THRESHOLD}%"
          
          # تسجيل التقرير في ملخص GitHub Actions
          echo "### 📊 Test Coverage Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "* **Current Line Coverage:** \`${COVERAGE}%\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Enforced Minimum Threshold:** \`${COVERAGE_THRESHOLD}%\`" >> $GITHUB_STEP_SUMMARY
          
          # فحص النسبة وإيقاف الـ CI عند الفشل
          awk -v cov="$COVERAGE" -v min="$COVERAGE_THRESHOLD" 'BEGIN {
            if (cov + 0 < min + 0) {
              print "❌ Build Failed: Test coverage (" cov "%) is below the required threshold of " min "%";
              exit 1;
            } else {
              print "✅ Coverage Gate Passed: " cov "% >= " min "%";
              exit 0;
            }
          }'

      # ✅ حفظ ملف التغطية كـ Artifact رسمي
      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14
