name: Flutter Quality & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Flutter Lint, Format & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ تم التثبيت عبر Commit SHA كامل (40 حرفاً) لإغلاق ثغرة الـ Insecure Module في Codacy
      - name: Setup Flutter Environment
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Outdated & Security Check
        run: flutter pub outdated

      - name: Verify Code Formatting
        run: dart format --output=none .

      # ✅ تشديد الفحص لرفع تقييم CI/CD Maturity
      - name: Analyze Static Code Quality
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Automated Test Suite with Coverage
        run: flutter test --coverage
