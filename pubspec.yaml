name: json_to_dart_tool
description: "A professional Flutter Clean Architecture & Model Generator tool."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_highlight: ^0.7.0
  google_fonts: ^8.1.0
  logging: ^1.3.0
  url_launcher: ^6.3.3

  # حزم توليد وتنزيل ملفات الـ ZIP للـ Web
  archive: ^4.7.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png